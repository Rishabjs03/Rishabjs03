name: Update profile art

# Refreshes contrib-heatmap.svg from real contribution data.
# Runs daily, on every push to main, and on demand (Actions tab -> Run workflow).
# wordmark.svg and info-card.svg are static: regenerate them locally after
# editing scripts/make_wordmark_svg.py or scripts/make_info_card.py.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: true

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch contribution data (public, no token)
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution graph
        run: python scripts/render_heatmap_svg.py

      - name: Commit refreshed art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
